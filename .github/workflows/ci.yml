name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RESEARCH_OS_RUN_PDF_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e ".[test,pdf]"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk poppler-utils
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_release_pipeline.py
      - name: Upload release field acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-field-acceptance
          path: build/field-acceptance-*
          if-no-files-found: ignore
          retention-days: 14
