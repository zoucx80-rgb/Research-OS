name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e ".[test]"
      - run: pytest -q tests/integration/storage/test_v1_2_lineage_migration.py
      - run: pytest -q
      - run: python scripts/release_gate_v1_1.py
