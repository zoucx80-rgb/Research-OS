name: ci
on: [push, pull_request]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[test]"
      - name: Diagnose Ruff format drift
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format .
          git diff --name-only
          git diff --exit-code --quiet
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: lint-imports
      - run: python -m pytest -q tests/regression/architecture/test_dependency_rules_v1_6.py
      - run: git diff --check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/unit tests/property tests/contract
      - name: Core contracts coverage gate
        run: >-
          python -m pytest -q
          tests/unit/contracts tests/property/contracts
          --cov=research_os.contracts
          --cov-report=term-missing
          --cov-fail-under=80
      - name: Application coverage gate
        run: >-
          python -m pytest -q
          tests/unit/application
          tests/integration/runtime/test_research_application.py
          tests/integration/runtime/test_two_phase_execution.py
          --cov=research_os.application
          --cov-report=term-missing
          --cov-fail-under=75

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/integration tests/regression

  acceptance:
    needs: [quality, unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RESEARCH_OS_RUN_PDF_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[test,pdf]"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk poppler-utils
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_release_pipeline.py --stage acceptance
      - name: Upload release verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-artifacts
          path: |
            build/field-acceptance-*
            build/historical-replay
          if-no-files-found: ignore
          retention-days: 14

  security-package:
    needs: [quality, unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pip_audit
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify installed wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/verify_distribution.py "$wheel" \
            --inventory-json build/distribution-inventory.json
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-distribution
          path: |
            dist/*
            build/distribution-inventory.json
          if-no-files-found: error
          retention-days: 14

  release-gate:
    needs: [quality, unit, integration, acceptance, security-package]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python scripts/verify_release_pipeline.py --stage release-gate
      - run: git diff --check
      - name: Build M5 single-commit delivery bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release_delivery.py \
            --delivery-parent-sha abd19bbc7e22d7958df853333e0ba8cedff39f6f \
            --output-dir build/Research-OS-v1.6.0-delivery
      - name: Upload M5 delivery bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Research-OS-v1.6.0-delivery
          path: build/Research-OS-v1.6.0-delivery/*
          if-no-files-found: error
          retention-days: 30
