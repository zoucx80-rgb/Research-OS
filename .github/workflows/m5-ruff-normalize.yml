name: m5-ruff-normalize

on:
  push:
    branches:
      - feat/v1.6.0-m5-quality-release

permissions:
  contents: write

concurrency:
  group: m5-ruff-normalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[test]"
      - name: Normalize repository with Ruff
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format .
          python -m ruff check . --fix || true
          git diff --check
          git status --short
      - name: Commit normalization to M5 feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No Ruff normalization changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: normalize repository with Ruff"
          git push origin "HEAD:${GITHUB_REF_NAME}"
