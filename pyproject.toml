[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-os"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "sqlalchemy>=2",
  "fastapi>=0.100",
  "pandas>=2",
  "numpy>=2",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "packaging>=24,<27",
  "rfc8785>=0.1,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "hypothesis>=6,<7",
  "mypy>=1.15,<2",
  "httpx2>=2,<3",
  "alembic>=1.13,<2",
  "pypdf>=6,<7",
  "ruff>=0.12,<1",
  "import-linter>=2,<3",
  "pip-audit>=2.9,<3",
  "build>=1.2,<2",
  "twine>=6,<7",
  "pytest-cov>=6,<8",
]
pdf = [
  "playwright>=1.62,<1.63",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "research_os.version.RESEARCH_OS_VERSION"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "build",
  "dist",
  ".venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
  "research_os.contracts.*",
  "research_os.application.*",
  "research_os.runtime.*",
  "research_os.plugins.*",
  "research_os.snapshots.*",
]
disallow_untyped_defs = true
warn_return_any = true

[tool.coverage.run]
branch = true
source = ["research_os"]

[tool.coverage.report]
show_missing = true
skip_covered = true
