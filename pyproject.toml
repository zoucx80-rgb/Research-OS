[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-os"
version = "1.5.6"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "sqlalchemy>=2",
  "fastapi>=0.100",
  "pandas>=2",
  "numpy>=2",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "httpx2>=2,<3",
  "alembic>=1.13,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
